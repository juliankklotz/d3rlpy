# Reproducible conda environment for the master-thesis d3rlpy fork.
#
# Reproduces the working "d3rlpy_dev_final_py310" env, with ONE correction:
# ale-py 0.8.1 -> 0.10.x. The old 0.8.1 is incompatible with gymnasium 1.0.0
# (gymnasium 1.0 requires ale-py's new top-level AtariEnv plugin entry point,
# which 0.8.1 lacks -> "module 'ale_py.env' has no attribute 'AtariEnv'" when
# recovering the Atari/Pong environment via minari). Everything else is pinned
# to the versions that produced the working CartPole + sepsis runs.
#
# Heavy binaries (torch, numpy, pandas, scikit-learn) are installed via conda,
# NOT pip: pip's resolver holds multi-GB CUDA wheels in memory and gets OOM-
# killed on the memory-limited login node. conda streams them.
#
# Build (does NOT touch the existing env) — see scripts/build_repro_env.sh,
# which runs this on a compute node to avoid the login-node memory cap.
name: d3rlpy_repro_py310
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.10.17
  # --- heavy binaries via conda (avoids pip OOM on login node) ---
  - numpy=1.26.4            # <2 required by this d3rlpy fork
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - pytorch=2.10.0
  - pytorch-cuda=12.8       # CUDA build to match the working env (torch+cu128)
  - pip
  - pip:
      # --- gym / gymnasium ---
      - gymnasium==1.0.0
      - gym==0.26.2             # legacy gym: still imported top-level in d3rlpy/datasets.py, types.py
      # --- Atari stack (ale-py CORRECTED to match gymnasium 1.0.0) ---
      - "ale-py>=0.10.1,<0.11"
      - AutoROM==0.6.1
      - AutoROM.accept-rom-license==0.6.1
      # --- datasets ---
      - minari==0.5.3
      - gymnasium-robotics==1.3.1
      # --- small pure-python d3rlpy runtime deps ---
      - structlog==25.5.0
      - dataclasses-json==0.6.7
      - tqdm>=4.66.1
      - h5py>=2.10.0
      - click>=8.0.1
      - typing-extensions>=4.8.0
      - colorama>=0.4.4
      # NOTE: d3rlpy itself installed separately (pip install -e . --no-deps).
