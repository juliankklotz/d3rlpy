# Reproducible conda environment for the master-thesis d3rlpy fork.
#
# Reproduces the working "d3rlpy_dev_final_py310" env, with ONE correction:
# ale-py 0.8.1 -> 0.10.x. The old 0.8.1 is incompatible with gymnasium 1.0.0
# (gymnasium 1.0 needs ale-py's new top-level AtariEnv plugin entry point,
# which 0.8.1 lacks -> "module 'ale_py.env' has no attribute 'AtariEnv'" when
# recovering the Atari/Pong env via minari). CartPole/sepsis were unaffected.
#
# torch is installed via PIP from PyTorch's cu128 index, NOT conda: the working
# env's torch is 2.10.0+cu128, and conda channels have no pytorch-cuda=12.8
# (verified: `pytorch-cuda=12.8` PackagesNotFoundError). conda here only creates
# the python interpreter; all libraries come from pip.
#
# The heavy pip install (torch cu128 wheel) is memory-hungry, so
# scripts/build_repro_env.sh runs it on a COMPUTE node with --no-cache-dir to
# avoid the login-node OOM that killed the naive build.
name: d3rlpy_repro_py310
channels:
  - conda-forge
dependencies:
  - python=3.10.17
  - pip
  - pip:
      # torch from the cu128 index (matches working env's 2.10.0+cu128)
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0
      # --- core (exact versions from the working env) ---
      - numpy==1.26.4          # <2 required by this d3rlpy fork
      - pandas==2.3.3
      - scikit-learn==1.7.2
      - gymnasium==1.0.0
      - gym==0.26.2             # legacy gym: still imported top-level in d3rlpy/datasets.py, types.py
      - structlog==25.5.0
      - dataclasses-json==0.6.7
      # --- Atari stack (ale-py CORRECTED to match gymnasium 1.0.0) ---
      - "ale-py>=0.10.1,<0.11"
      - AutoROM==0.6.1
      - AutoROM.accept-rom-license==0.6.1
      # --- datasets ---
      - minari==0.5.3
      - gymnasium-robotics==1.3.1
      # --- remaining d3rlpy runtime deps ---
      - tqdm>=4.66.1
      - h5py>=2.10.0
      - click>=8.0.1
      - typing-extensions>=4.8.0
      - colorama>=0.4.4
      # NOTE: d3rlpy itself installed separately (pip install -e . --no-deps).
